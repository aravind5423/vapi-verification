<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Voice Verification</title>
  <meta name="description" content="AI-powered identity verification — a quick voice call, right in your browser." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Surface any load/runtime error on the page instead of failing silently.
    window.__showBootError = function (msg) {
      var el = document.getElementById("bootError");
      if (el) { el.style.display = "block"; el.textContent = String(msg); }
    };
    window.addEventListener("error", function (e) {
      window.__showBootError("⚠️ Load error: " + (e.message || (e.error && e.error.message) || e.type));
    });
    window.addEventListener("unhandledrejection", function (e) {
      var r = e.reason;
      window.__showBootError("⚠️ " + ((r && r.message) || r || "Unhandled error"));
    });
  </script>
</head>
<body>
  <div class="blob"></div>
  <div class="blob2"></div>

  <div class="container">
    <div id="bootError" class="boot-error" style="display:none"></div>
    <div class="header">
      <div class="badge">Voice AI</div>
      <h1>AI Verification</h1>
      <p class="subtitle">Start a quick voice verification — right here in your browser. Make sure your microphone is on.</p>
    </div>

    <!-- Idle: start form -->
    <form id="startForm" novalidate>
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g. John Doe" autocomplete="name" />
        <div class="field-error" id="nameError">Please enter your name.</div>
      </div>

      <button type="button" id="startBtn">
        <div class="btn-inner">
          <span id="startBtnText">Start verification call</span>
          <div class="spinner" id="spinner"></div>
        </div>
      </button>
    </form>

    <!-- In-call / result card -->
    <div class="status-card" id="statusCard">
      <div class="orb pending" id="orb">
        <span class="orb-emoji" id="orbEmoji">🎙️</span>
      </div>
      <div class="status-title" id="statusTitle">Connecting…</div>
      <div class="status-message" id="statusMessage">Allow microphone access to begin.</div>

      <div class="outcome-badge" id="outcomeBadge"></div>

      <div class="transcript" id="transcript"></div>

      <div class="call-controls" id="callControls">
        <button class="ctrl-btn" id="muteBtn" type="button">Mute</button>
        <button class="ctrl-btn danger" id="endBtn" type="button">End call</button>
      </div>

      <button class="retry-btn" id="retryBtn" type="button">↩ Start a new verification</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
